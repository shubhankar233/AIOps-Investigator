AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AIOps Investigator

  AI-powered serverless incident investigation platform built with AWS SAM,
  Amazon Bedrock, API Gateway, Lambda and DynamoDB.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    MemorySize: 512

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
Resources:
  InvestigationEngineFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: functions/investigation_engine/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InvestigationTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"

      Environment:
        Variables:
          INVESTIGATION_TABLE_NAME: !Ref InvestigationTable

      Events:
        AnalyzeIncident:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /api/v1/analyze
            Method: post

        ListInvestigations:
          Type: Api
          Properties:
            Path: /api/v1/investigations
            Method: get

        GetInvestigation:
          Type: Api
          Properties:
            Path: /api/v1/investigations/{incident_id}
            Method: get

  InvestigationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-investigations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  InvestigationEngineApi:
    Description: API Gateway endpoint URL for Prod stage for Investigation Engine
      function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/api/v1/analyze"
  InvestigationEngineFunction:
    Description: Investigation Engine Lambda ARN
    Value: !GetAtt InvestigationEngineFunction.Arn
  InvestigationEngineFunctionIamRole:
    Description: Implicit IAM Role created for Investigation Engine Lambda
    Value: !GetAtt InvestigationEngineFunctionRole.Arn
